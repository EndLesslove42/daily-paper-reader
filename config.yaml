  keyword_recall_mode: or
  intent_profiles:
  - tag: deposition-surrogates
    description: 沉降过程的机器学习替代与在线耦合：关注沉降速度、通量和浓度增量的物理表达，以及守恒、非负性、长期稳定性和跨物种泛化。
    enabled: true
    paper_sources:
    - arxiv
    keywords:
    - keyword: dry deposition surrogate
      keyword_cn: 干沉降代理模型
      query: machine learning surrogate parameterization for atmospheric dry deposition velocity
    - keyword: wet scavenging machine learning
      keyword_cn: 湿清除机器学习参数化
      query: machine learning parameterization of aerosol wet scavenging and wet deposition
    intent_queries:
    - query: Hybrid physics machine learning surrogates for dry deposition velocity or wet scavenging in chemical
        transport models, evaluated through online coupling and multi-step rollout
      query_cn: 化学传输模型中干沉降速度或湿清除的物理与机器学习混合替代，关注在线耦合和多步运行验证
      enabled: true
      source: manual
    - query: Process-level atmospheric chemistry emulators predicting fluxes tendencies or shared species channels
        with mass conservation positivity and stable long-term integration
      query_cn: 预测通量、变化率或共享物种通道的大气化学过程代理，关注质量守恒、非负性和长期积分稳定性
      enabled: true
      source: manual
    updated_at: '2026-10-31T00:00:00+08:00'
  - tag: surface-exchange
    description: 干沉降与双向地表交换的过程参数化：关注阻力网络、气孔和非气孔途径、补偿点及地表异质性，以可迁移到空气质量模型的机理和评估为主。
    enabled: true
    paper_sources:
    - arxiv
    keywords:
    - keyword: dry deposition parameterization
      keyword_cn: 干沉降参数化
      query: gas and aerosol dry deposition resistance parameterization in chemical transport models
    - keyword: ammonia bidirectional exchange
      keyword_cn: 氨双向交换
      query: ammonia bidirectional land atmosphere exchange compensation point resistance model
    intent_queries:
    - query: Mechanistic improvements and observational evaluation of gas or aerosol dry deposition velocity parameterizations
        in CMAQ GEOS-Chem or WRF-Chem
      query_cn: CMAQ、GEOS-Chem、WRF-Chem中气体或颗粒物干沉降速度参数化的机理改进与观测评估
      enabled: true
      source: manual
    - query: Modeling bidirectional ammonia exchange and stomatal nonstomatal ozone deposition using canopy soil
        moisture vegetation phenology and surface resistance
      query_cn: 利用冠层、土壤湿度、植被物候与地表阻力模拟氨双向交换及臭氧气孔和非气孔沉降
      enabled: true
      source: manual
    updated_at: '2026-10-31T00:00:00+08:00'
  - tag: deposition-constraints
    description: 沉降与地表交换的观测约束：关注卫星柱浓度、地面浓度和通量如何辨识沉降参数，重视敏感性、排放混淆、观测算子与不确定性。
    enabled: true
    paper_sources:
    - arxiv
    keywords:
    - keyword: satellite dry deposition inversion
      keyword_cn: 卫星约束干沉降反演
      query: satellite atmospheric columns constrain dry deposition velocity parameter inversion
    - keyword: deposition parameter identifiability
      keyword_cn: 沉降参数可辨识性
      query: identifiability sensitivity and uncertainty of atmospheric deposition parameters from concentration
        and flux observations
    intent_queries:
    - query: Inferring dry deposition velocities or bidirectional surface exchange parameters from satellite NH3
        NO2 SO2 columns with retrieval averaging kernels and chemical transport model observation operators
      query_cn: 结合平均核与化学传输模型观测算子，用卫星NH3、NO2、SO2柱浓度反演干沉降速度或双向交换参数
      enabled: true
      source: manual
    - query: Sensitivity analysis inverse modeling and observation-constrained hybrid learning to distinguish emission
        transport chemistry and deposition errors using atmospheric concentration and surface flux measurements
      query_cn: 利用浓度与地表通量开展敏感性分析、反演和观测约束混合学习，区分排放、输送、化学及沉降误差
      enabled: true
      source: manual
    updated_at: '2026-10-31T00:00:00+08:00'
  - tag: geospatial-surface
    description: 遥感表征服务地表过程参数化：关注AlphaEarth及其他时序遥感基础模型、月度地表状态与网格聚合，优先地表交换、阻力、通量和可迁移方法。
    enabled: true
    paper_sources:
    - arxiv
    keywords:
    - keyword: satellite embeddings land surface
      keyword_cn: 卫星嵌入与地表过程
      query: satellite foundation model embeddings for land surface process parameterization and ecosystem fluxes
    - keyword: temporal remote sensing surface flux
      keyword_cn: 时序遥感与地表通量
      query: temporal remote sensing representations of vegetation phenology soil moisture and surface exchange
        fluxes
    intent_queries:
    - query: AlphaEarth or other geospatial foundation model representations for land surface exchange deposition
        vegetation canopy conductance and environmental process modeling
      query_cn: AlphaEarth或其他地理空间基础模型表征用于陆气交换、沉降、植被冠层导度与环境过程模拟
      enabled: true
      source: manual
    - query: Seasonal or monthly remote sensing embeddings combined with dynamic vegetation soil moisture and meteorology
        for surface process prediction including subgrid heterogeneity aggregation and spatial temporal generalization
      query_cn: 月度或季节遥感嵌入结合植被、土壤湿度和气象预测地表过程，关注次网格异质性、聚合与时空泛化
      enabled: true
      source: manual
    updated_at: '2026-10-31T00:00:00+08:00'
  - tag: source-sink-coupling
    description: 排放、沉降与垂直混合的数值耦合：关注算子分裂、边界条件、时间步与垂直分辨率敏感性，以及可迁移到区域化学传输模型的守恒耦合方法。
    enabled: true
    paper_sources:
    - arxiv
    keywords:
    - keyword: emission deposition turbulent mixing
      keyword_cn: 排放沉降湍流混合耦合
      query: numerical coupling of emissions dry deposition and turbulent vertical mixing
    - keyword: operator splitting atmospheric transport
      keyword_cn: 大气输送算子分裂
      query: operator splitting errors in atmospheric transport surface sources sinks and vertical diffusion
    intent_queries:
    - query: Numerical coupling of surface emissions dry deposition and vertical turbulent mixing in chemical transport
        models including operator splitting errors timestep dependence and vertical resolution sensitivity
      query_cn: 化学传输模型中地表排放、干沉降和垂直湍流混合的数值耦合，关注分裂误差及时间步、垂直分辨率敏感性
      enabled: true
      source: manual
    - query: Conservative and positivity preserving coupling of atmospheric surface source sink fluxes and vertical
        diffusion evaluated with single-column models or regional chemistry transport simulations
      query_cn: 地表源汇通量与垂直扩散的守恒、非负耦合，关注单柱模型或区域化学传输模拟中的评估
      enabled: true
      source: manual
    updated_at: '2026-10-31T00:00:00+08:00'
